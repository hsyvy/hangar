name: Hangar
options:
  bundleIdPrefix: com.h
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO

targets:
  Hangar:
    type: application
    platform: macOS
    sources:
      - path: Hangar
    info:
      path: Hangar/Info.plist
      properties:
        CFBundleName: Hangar
        CFBundleDisplayName: Hangar
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: YES
        LSUIElement: NO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.h.hangar
        PRODUCT_NAME: Hangar
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: Hangar/Hangar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
